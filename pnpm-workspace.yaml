packages:
  - apps/*
  - packages/*
  - services/*

linkWorkspacePackages: false
saveWorkspaceProtocol: rolling
sharedWorkspaceLockfile: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver

catalog:
  '@eslint/js': ^9.0.0
  '@jest/globals': ^30.0.0
  '@nestjs/common': ^12.0.0
  '@nestjs/core': ^12.0.0
  '@nestjs/platform-express': ^12.0.0
  '@nestjs/swagger': ^12.0.0
  '@nestjs/testing': ^12.0.0
  '@testing-library/dom': ^10.0.0
  '@testing-library/jest-dom': ^7.0.0
  '@testing-library/react': ^16.0.0
  '@types/jest': ^30.0.0
  '@types/express': ^5.0.0
  '@types/node': ^24.0.0
  '@types/pg': ^8.0.0
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  '@types/supertest': ^6.0.0
  '@vitejs/plugin-react': ^6.0.0
  cross-env: ^10.0.0
  class-transformer: ^0.5.0
  class-validator: ^0.14.0
  eslint: ^9.0.0
  globals: ^16.0.0
  jest: ^30.0.0
  jsdom: ^30.0.0
  prettier: ^3.0.0
  pg: ^8.0.0
  react: ^19.0.0
  react-dom: ^19.0.0
  reflect-metadata: ^0.2.0
  rxjs: ^7.0.0
  supertest: ^7.0.0
  ts-jest: ^29.0.0
  tsx: ^4.0.0
  turbo: ^2.0.0
  typescript: ^5.0.0
  typescript-eslint: ^8.0.0
  vite: ^8.0.0
  vitest: ^5.0.0

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  unrs-resolver: true
