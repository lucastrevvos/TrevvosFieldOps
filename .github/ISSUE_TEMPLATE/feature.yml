name: Feature
description: Deliver user-visible behavior
title: "[FEATURE] "
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem are we solving?
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a... I want... so that...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Given... when... then..."
    validations:
      required: true
  - type: textarea
    id: study
    attributes:
      label: Study outcomes
      description: What engineering concepts should this feature demonstrate?
  - type: textarea
    id: out
    attributes:
      label: Out of scope
